name = "website-health-dashboard"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Import .html files as text modules
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Import image files as binary data modules
[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.svg"]
fallthrough = false

# Custom domains
[[routes]]
pattern = "shelobweb.com"
custom_domain = true

[[routes]]
pattern = "www.shelobweb.com"
custom_domain = true

# Cron triggers:
#   0 11 * * * — nightly site audits (3am PST)
#   0 16 * * * — lifecycle/drip emails (9am PDT — humane send time)
[triggers]
crons = ["0 11 * * *", "0 16 * * *"]

# ============================================
# STAGING ENVIRONMENT
# ============================================
# To create staging resources:
#   wrangler d1 create wine-seo-audits-staging
#   wrangler kv:namespace create SEO_AUDITS --env staging
# Then replace the placeholder IDs below.
# To add auth: wrangler secret put AUTH_TOKEN --env staging

[env.staging]
name = "wine-health-dashboard-staging"
# No cron triggers in staging

# Staging D1 — replace with your staging database ID
[[env.staging.d1_databases]]
binding = "DB"
database_name = "wine-seo-audits-staging"
database_id = "9f5ca614-0ff3-4202-b221-7e5a83a077b8"

# Staging KV — replace with your staging KV namespace ID
[[env.staging.kv_namespaces]]
binding = "SEO_AUDITS"
id = "5483be90be8440028b492de4300cace6"

[env.staging.vars]
ADAIR_CF_ZONE_IDS = "3c6f5ec53c64d53b13a3edb15bc86d79,91f16d65b970bfe14bdd005466c305e6"
BRCOHN_CF_ZONE_IDS = "ed7f4a7b5fa022c2e803dd40d833d541"
CLOSPEGASE_CF_ZONE_IDS = "530921bb036e394919e87b3d4956f818"
GIRARD_CF_ZONE_IDS = "3568f251652a6ab6714876711cb2dd9b"
KUNDE_CF_ZONE_IDS = "9422c182e70910ae340dfd100357e762"
VIANSA_CF_ZONE_IDS = "152084b83d9eccf45eee4eb6606bb9e0"
ADAIR_GSC_PROPERTIES = "sc-domain:adairfamilywines.com,sc-domain:adairwinery.com"
BRCOHN_GSC_PROPERTIES = "sc-domain:brcohn.com"
CLOSPEGASE_GSC_PROPERTIES = "sc-domain:clospegase.com"
GIRARD_GSC_PROPERTIES = "sc-domain:girardwinery.com"
KUNDE_GSC_PROPERTIES = "sc-domain:kunde.com"
VIANSA_GSC_PROPERTIES = "sc-domain:viansa.com"

# Workers AI binding (used for AI fix suggestions)
[ai]
binding = "AI"

# ============================================
# PRODUCTION (default)
# ============================================

# KV Namespace for storing SEO audit results
[[kv_namespaces]]
binding = "SEO_AUDITS"
id = "1d35ef3fe7034018aa29af8a5ac00064"

# D1 Database for audit history and tracking
[[d1_databases]]
binding = "DB"
database_name = "wine-seo-audits"
database_id = "7e354146-aefa-4c76-bab9-50fa1eb88e53"

[vars]
# Property Zone IDs
ADAIR_CF_ZONE_IDS = "3c6f5ec53c64d53b13a3edb15bc86d79,91f16d65b970bfe14bdd005466c305e6"
BRCOHN_CF_ZONE_IDS = "ed7f4a7b5fa022c2e803dd40d833d541"
CLOSPEGASE_CF_ZONE_IDS = "530921bb036e394919e87b3d4956f818"
GIRARD_CF_ZONE_IDS = "3568f251652a6ab6714876711cb2dd9b"
KUNDE_CF_ZONE_IDS = "9422c182e70910ae340dfd100357e762"
VIANSA_CF_ZONE_IDS = "152084b83d9eccf45eee4eb6606bb9e0"

# Search Console Properties
ADAIR_GSC_PROPERTIES = "sc-domain:adairfamilywines.com,sc-domain:adairwinery.com"
BRCOHN_GSC_PROPERTIES = "sc-domain:brcohn.com"
CLOSPEGASE_GSC_PROPERTIES = "sc-domain:clospegase.com"
GIRARD_GSC_PROPERTIES = "sc-domain:girardwinery.com"
KUNDE_GSC_PROPERTIES = "sc-domain:kunde.com"
VIANSA_GSC_PROPERTIES = "sc-domain:viansa.com"

# Stripe Price IDs (set after creating products in Stripe Dashboard)
# STRIPE_PRO_PRICE_ID    = "price_xxx"  — Pro plan $19/mo
# STRIPE_AGENCY_PRICE_ID = "price_xxx"  — Agency plan $49/mo

# Secrets (add via: wrangler secret put <NAME>)
# CLOUDFLARE_API_TOKEN    - For Cloudflare API access
# GOOGLE_SERVICE_ACCOUNT  - Google service account JSON (legacy)
# PAGESPEED_API_KEY       - PageSpeed Insights API key
# AUTH_TOKEN              - Legacy admin endpoint protection
# BREVO_API_KEY           - Brevo email API key (magic link auth)
# ENCRYPTION_KEY          - For encrypting stored OAuth tokens (32-byte hex)
# STRIPE_SECRET_KEY       - Stripe secret key
# STRIPE_WEBHOOK_SECRET   - Stripe webhook signing secret
# STRIPE_PRO_PRICE_ID    - Stripe Price ID for Pro plan
# STRIPE_AGENCY_PRICE_ID - Stripe Price ID for Agency plan
# GOOGLE_OAUTH_CLIENT_ID  - Google OAuth client ID
# GOOGLE_OAUTH_CLIENT_SECRET - Google OAuth client secret
